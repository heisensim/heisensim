# Heisensim configuration for testing a 3-node etcd cluster
# Run with: heisensim run --config examples/etcd-cluster/heisensim.toml

[simulation]
seed = 42
duration = "5m"

[[nodes]]
name = "etcd-1"
image = "quay.io/coreos/etcd:v3.5.9"
command = ["etcd", "--name=etcd-1", "--initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380"]

[[nodes]]
name = "etcd-2"
image = "quay.io/coreos/etcd:v3.5.9"
command = ["etcd", "--name=etcd-2", "--initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380"]

[[nodes]]
name = "etcd-3"
image = "quay.io/coreos/etcd:v3.5.9"
command = ["etcd", "--name=etcd-3", "--initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380"]

[faults]
enabled = ["partition", "crash", "clock_skew"]
partition_probability = 0.1
crash_probability = 0.05
clock_skew_max_ms = 500

[[properties]]
name = "no_crash"
kind = "builtin"

[[properties]]
name = "no_hang"
kind = "builtin"
params = { timeout_secs = 30 }

[[properties]]
name = "linearizable_reads"
kind = "builtin"
