name: Preview Environment
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      duration:
        description: "Test duration"
        default: "2m"
      seeds:
        description: "Number of seeds to explore"
        default: "5"

concurrency:
  group: preview-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Build heisensim from source ────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build heisensim
        run: |
          cargo install --path crates/cli --locked
          heisensim --version

      # ── Spin up k3d cluster ────────────────────────────────────
      - name: Create k3d cluster
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d cluster create preview --agents 2 --no-lb --timeout 120s
          kubectl cluster-info

      # ── Deploy demo app ────────────────────────────────────────
      - name: Deploy demo app
        working-directory: examples/k8s-demo
        run: |
          kubectl apply -f manifests.yaml
          echo "⏳ Waiting for pods..."
          kubectl wait --for=condition=ready pod --all \
            -n heisensim-demo --timeout=120s
          echo "✅ All pods ready:"
          kubectl get pods -n heisensim-demo -o wide

      # ── Generate RBAC ──────────────────────────────────────────
      - name: Apply RBAC
        run: |
          heisensim rbac \
            --namespace heisensim-demo \
            --faults crash,latency,partition \
          | kubectl apply -f -

      # ── Run chaos test ─────────────────────────────────────────
      - name: Run chaos test
        id: chaos
        working-directory: examples/k8s-demo
        shell: bash
        run: |
          set -o pipefail
          DURATION="${{ github.event.inputs.duration || '2m' }}"
          SEEDS="${{ github.event.inputs.seeds || '5' }}"

          set +e
          heisensim explore \
            --namespace heisensim-demo \
            --seeds "${SEEDS}" \
            --duration "${DURATION}" \
            --warmup 15s \
            --faults crash,latency,partition \
            --config heisensim.toml \
            --output json 2>/dev/null | tee /tmp/heisensim-report.json
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "exit-code=${EXIT_CODE}" >> $GITHUB_OUTPUT

          # Also generate JUnit for GitHub test summary
          heisensim run \
            --namespace heisensim-demo \
            --seed 42 \
            --duration 30s \
            --warmup 10s \
            --faults crash,latency,partition \
            --config heisensim.toml \
            --output junit > /tmp/heisensim-junit.xml || true

          exit ${EXIT_CODE}

      # ── Upload artifacts ───────────────────────────────────────
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heisensim-report
          path: |
            /tmp/heisensim-report.json
            /tmp/heisensim-junit.xml

      # ── PR comment with results ────────────────────────────────
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const MARKER = '<!-- heisensim-preview-env -->';
            const fs = require('fs');
            let report = '{}';
            try {
              report = fs.readFileSync('/tmp/heisensim-report.json', 'utf8');
            } catch (e) {
              report = '{"error": "Report not generated"}';
            }

            const exitCode = '${{ steps.chaos.outputs.exit-code }}';
            const passed = exitCode === '0';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'All properties passed' : 'Some properties failed';

            let body = `${MARKER}\n## ${icon} Chaos Test Results\n\n`;
            body += `**Status:** ${status}\n`;
            body += `**Exit code:** ${exitCode}\n\n`;

            try {
              const data = JSON.parse(report);
              // explore mode wraps results in a top-level array
              const results = data.results || [data];
              const allProps = [];
              for (const run of results) {
                if (run.properties) {
                  for (const p of run.properties) {
                    // Deduplicate by property name (keep worst result)
                    const existing = allProps.find(x => x.property_name === p.property_name);
                    if (!existing) {
                      allProps.push({...p});
                    } else if (existing.passed && !p.passed) {
                      Object.assign(existing, p);
                    }
                  }
                }
              }

              if (allProps.length > 0) {
                body += `**Seeds tested:** ${results.length}\n\n`;
                body += '| Property | Result | Expected | Actual |\n';
                body += '|:---------|:-------|:---------|:-------|\n';
                for (const p of allProps) {
                  const r = p.passed ? '✅ PASS' : '❌ FAIL';
                  body += `| ${p.property_name} | ${r} | ${p.expected} | ${p.actual} |\n`;
                }
              }
            } catch (e) {
              body += `\n<details><summary>Raw output</summary>\n\n\`\`\`json\n${report}\n\`\`\`\n</details>\n`;
            }

            body += `\n---\n*Tested with heisensim preview environment (k3d)*`;

            // Find existing bot comment with our marker
            const allComments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              }
            );

            const existing = allComments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # ── Teardown ───────────────────────────────────────────────
      - name: Teardown k3d cluster
        if: always()
        run: k3d cluster delete preview || true
