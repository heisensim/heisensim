name: E2E Preview Environment
on:
  # Manual dispatch and nightly — NOT on every PR.
  # This is an integration smoke test for heisensim itself,
  # not a per-PR gate (too slow/fragile for that).
  workflow_dispatch:
    inputs:
      duration:
        description: "Test duration"
        default: "2m"
      seeds:
        description: "Number of seeds to explore"
        default: "5"
  schedule:
    - cron: '0 4 * * *'  # 4 AM UTC daily

concurrency:
  group: preview-e2e
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Build heisensim from source ────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build heisensim
        run: |
          cargo install --path crates/cli --locked
          heisensim --version

      # ── Spin up k3d cluster ────────────────────────────────────
      - name: Create k3d cluster
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d cluster create preview --agents 2 --no-lb --timeout 120s
          kubectl cluster-info

      # ── Deploy demo app ────────────────────────────────────────
      - name: Deploy demo app
        working-directory: examples/k8s-demo
        run: |
          kubectl apply -f manifests.yaml
          echo "⏳ Waiting for pods..."
          kubectl wait --for=condition=ready pod --all \
            -n heisensim-demo --timeout=120s
          echo "✅ All pods ready:"
          kubectl get pods -n heisensim-demo -o wide

      # ── Generate RBAC ──────────────────────────────────────────
      - name: Apply RBAC
        run: |
          heisensim rbac \
            --namespace heisensim-demo \
            --faults crash,latency,partition \
          | kubectl apply -f -

      # ── Run chaos test ─────────────────────────────────────────
      - name: Run chaos test
        id: chaos
        working-directory: examples/k8s-demo
        shell: bash
        run: |
          set -o pipefail
          DURATION="${{ github.event.inputs.duration || '2m' }}"
          SEEDS="${{ github.event.inputs.seeds || '5' }}"

          set +e
          heisensim explore \
            --namespace heisensim-demo \
            --seeds "${SEEDS}" \
            --duration "${DURATION}" \
            --warmup 15s \
            --faults crash,latency,partition \
            --config heisensim.toml \
            --output json 2>/dev/null | tee /tmp/heisensim-report.json
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "exit-code=${EXIT_CODE}" >> $GITHUB_OUTPUT

          # Also generate JUnit for GitHub test summary
          heisensim run \
            --namespace heisensim-demo \
            --seed 42 \
            --duration 30s \
            --warmup 10s \
            --faults crash,latency,partition \
            --config heisensim.toml \
            --output junit > /tmp/heisensim-junit.xml || true

          exit ${EXIT_CODE}

      # ── Upload artifacts ───────────────────────────────────────
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heisensim-report
          path: |
            /tmp/heisensim-report.json
            /tmp/heisensim-junit.xml

      # ── Job summary ──────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          if [ "${{ steps.chaos.outputs.exit-code }}" = "0" ]; then
            echo "## ✅ E2E Chaos Test Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ E2E Chaos Test Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See uploaded artifacts for full JSON and JUnit reports." >> $GITHUB_STEP_SUMMARY

      # ── Teardown ───────────────────────────────────────────────
      - name: Teardown k3d cluster
        if: always()
        run: k3d cluster delete preview || true
