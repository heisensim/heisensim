name: "heisensim"
description: "Continuous SLA validation for Kubernetes — inject faults, verify properties, in CI"
author: "heisensim"

branding:
  icon: "zap"
  color: "purple"

inputs:
  namespace:
    description: "Target Kubernetes namespace"
    required: true
  duration:
    description: "Test duration (e.g. 2m, 5m)"
    default: "5m"
  seed:
    description: "Deterministic seed (omit for random)"
    required: false
  config:
    description: "Path to heisensim.toml config file"
    required: false
  faults:
    description: "Comma-separated fault types (crash,latency,partition)"
    default: "crash,latency"
  warmup:
    description: "Warmup period before fault injection"
    default: "30s"
  output:
    description: "Output format (terminal, json, markdown)"
    default: "json"
  version:
    description: "heisensim version (Docker tag)"
    default: "latest"
  args:
    description: "Additional arguments to pass to heisensim"
    required: false

outputs:
  exit-code:
    description: "Exit code (0 = all properties pass, 1 = failure)"
    value: ${{ steps.run.outputs.exit-code }}
  report:
    description: "Path to the JSON report file"
    value: ${{ steps.run.outputs.report }}

runs:
  using: "composite"
  steps:
    - name: Run heisensim
      id: run
      shell: bash
      run: |
        REPORT_PATH="${RUNNER_TEMP}/heisensim-report.json"

        ARGS="run"
        ARGS="${ARGS} --namespace ${{ inputs.namespace }}"
        ARGS="${ARGS} --duration ${{ inputs.duration }}"
        ARGS="${ARGS} --warmup ${{ inputs.warmup }}"
        ARGS="${ARGS} --faults ${{ inputs.faults }}"
        ARGS="${ARGS} --output ${{ inputs.output }}"

        if [ -n "${{ inputs.seed }}" ]; then
          ARGS="${ARGS} --seed ${{ inputs.seed }}"
        fi

        if [ -n "${{ inputs.config }}" ]; then
          ARGS="${ARGS} --config ${{ inputs.config }}"
        fi

        if [ -n "${{ inputs.args }}" ]; then
          ARGS="${ARGS} ${{ inputs.args }}"
        fi

        set +e
        docker run --rm \
          --network host \
          -v "${HOME}/.kube:/root/.kube:ro" \
          -v "$(pwd):/workspace:ro" \
          -w /workspace \
          "ghcr.io/heisensim/heisensim:${{ inputs.version }}" \
          ${ARGS} | tee "${REPORT_PATH}"
        EXIT_CODE=$?
        set -e

        echo "exit-code=${EXIT_CODE}" >> $GITHUB_OUTPUT
        echo "report=${REPORT_PATH}" >> $GITHUB_OUTPUT

        exit ${EXIT_CODE}
