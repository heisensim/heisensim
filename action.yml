name: 'heisensim'
description: 'Run heisensim chaos tests in your CI'

inputs:
  config:
    description: 'Path to heisensim.toml config file'
    required: true
  version:
    description: 'heisensim version to install'
    required: false
    default: 'latest'
  args:
    description: 'Additional arguments to pass to heisensim run'
    required: false
  upload-results:
    description: 'Upload JUnit XML as artifact'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Detect platform
      id: platform
      shell: bash
      run: |
        OS="${{ runner.os }}"
        ARCH="${{ runner.arch }}"
        
        if [ "$OS" = "Linux" ] && [ "$ARCH" = "X64" ]; then
          TARGET="x86_64-unknown-linux-gnu"
        elif [ "$OS" = "Linux" ] && [ "$ARCH" = "ARM64" ]; then
          TARGET="aarch64-unknown-linux-gnu"
        elif [ "$OS" = "macOS" ] && [ "$ARCH" = "X64" ]; then
          TARGET="x86_64-apple-darwin"
        elif [ "$OS" = "macOS" ] && [ "$ARCH" = "ARM64" ]; then
          TARGET="aarch64-apple-darwin"
        elif [ "$OS" = "Windows" ] && [ "$ARCH" = "X64" ]; then
          TARGET="x86_64-pc-windows-msvc"
        else
          echo "Unsupported platform: $OS $ARCH"
          exit 1
        fi
        echo "target=$TARGET" >> "$GITHUB_OUTPUT"

    - name: Determine version
      id: version
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          VERSION=$(curl -sL https://api.github.com/repos/heisensim/heisensim/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
        fi
        VERSION="${VERSION#v}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install
      shell: bash
      run: |
        TARGET="${{ steps.platform.outputs.target }}"
        VERSION="${{ steps.version.outputs.version }}"
        URL="https://github.com/heisensim/heisensim/releases/download/v${VERSION}/heisensim-v${VERSION}-${TARGET}.tar.gz"
        
        mkdir -p "$RUNNER_TEMP/heisensim"
        curl -sL "$URL" | tar -xz -C "$RUNNER_TEMP/heisensim"
        echo "$RUNNER_TEMP/heisensim" >> "$GITHUB_PATH"

    - name: Run
      shell: bash
      run: |
        heisensim run --config "${{ inputs.config }}" --output junit ${{ inputs.args }}

    - name: Upload results
      if: ${{ inputs.upload-results == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: heisensim-results
        path: junit.xml
