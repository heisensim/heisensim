name: 'heisensim'
description: 'Run heisensim chaos tests in your CI'

inputs:
  config:
    description: 'Path to heisensim.toml config file'
    required: true
  version:
    description: 'heisensim version to install'
    required: false
    default: 'latest'
  args:
    description: 'Additional arguments to pass to heisensim run'
    required: false
  upload-results:
    description: 'Upload JUnit XML as artifact'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Detect platform
      id: platform
      shell: bash
      run: |
        OS="${{ runner.os }}"
        ARCH="${{ runner.arch }}"
        
        if [ "$OS" = "Linux" ] && [ "$ARCH" = "X64" ]; then
          TARGET="x86_64-unknown-linux-gnu"
        elif [ "$OS" = "Linux" ] && [ "$ARCH" = "ARM64" ]; then
          TARGET="aarch64-unknown-linux-gnu"
        elif [ "$OS" = "macOS" ] && [ "$ARCH" = "X64" ]; then
          TARGET="x86_64-apple-darwin"
        elif [ "$OS" = "macOS" ] && [ "$ARCH" = "ARM64" ]; then
          TARGET="aarch64-apple-darwin"
        else
          echo "Unsupported platform: $OS $ARCH"
          exit 1
        fi
        echo "target=$TARGET" >> "$GITHUB_OUTPUT"

    - name: Determine version
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        VERSION="$INPUT_VERSION"
        if [ "$VERSION" = "latest" ]; then
          VERSION=$(curl -sL https://api.github.com/repos/heisensim/heisensim/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
        fi
        VERSION="${VERSION#v}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install
      shell: bash
      run: |
        TARGET="${{ steps.platform.outputs.target }}"
        VERSION="${{ steps.version.outputs.version }}"
        BASE_URL="https://github.com/heisensim/heisensim/releases/download/v${VERSION}"
        ARCHIVE="heisensim-v${VERSION}-${TARGET}.tar.gz"
        URL="${BASE_URL}/${ARCHIVE}"
        
        mkdir -p "$RUNNER_TEMP/heisensim"
        curl -sL "$URL" -o "$RUNNER_TEMP/heisensim/${ARCHIVE}"
        curl -sL "${BASE_URL}/SHA256SUMS" -o "$RUNNER_TEMP/heisensim/SHA256SUMS"
        cd "$RUNNER_TEMP/heisensim"
        grep "${ARCHIVE}" SHA256SUMS | sha256sum -c -
        tar -xzf "${ARCHIVE}"
        echo "$RUNNER_TEMP/heisensim" >> "$GITHUB_PATH"

    - name: Run
      shell: bash
      env:
        HEISENSIM_CONFIG: ${{ inputs.config }}
        HEISENSIM_ARGS: ${{ inputs.args }}
      run: |
        heisensim run --config "$HEISENSIM_CONFIG" --output junit $HEISENSIM_ARGS

    - name: Upload results
      if: ${{ inputs.upload-results == 'true' && !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: heisensim-results
        path: junit.xml
