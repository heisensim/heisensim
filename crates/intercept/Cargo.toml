[package]
name = "heisensim-intercept"
description = "Syscall interception layer for heisensim (vDSO trampoline, ptrace, seccomp-BPF)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "heisensim-inject"
path = "src/bin/heisensim_inject.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:tracing-subscriber", "dep:serde_json"]

[dependencies]
heisensim-core.workspace = true
nix.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
goblin = "0.9"
serde.workspace = true
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
serde_json = { version = "1", optional = true }
humantime = "2.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
memmap2 = "0.9"
signal-hook = "0.3"

[dev-dependencies]
serde_json = "1"
