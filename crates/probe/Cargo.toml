[package]
name = "heisensim-probe"
description = "Health probe runner for heisensim chaos testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
heisensim-timeline.workspace = true
anyhow.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
opentelemetry.workspace = true
tracing-opentelemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tonic.workspace = true
tonic-health.workspace = true

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "rt-tokio", "testing"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.33"
