[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/heisensim/heisensim"
homepage = "https://heisensim.dev"
authors = ["Heisensim Contributors"]

[workspace.dependencies]
heisensim-core = { version = "0.14.0", path = "crates/core" }
heisensim-intercept = { version = "0.14.0", path = "crates/intercept" }
heisensim-fault = { version = "0.14.0", path = "crates/fault" }
heisensim-props = { version = "0.14.0", path = "crates/props" }
heisensim-timeline = { version = "0.14.0", path = "crates/timeline" }
heisensim-probe = { version = "0.14.0", path = "crates/probe" }
heisensim-k8s = { version = "0.14.0", path = "crates/k8s" }

# External dependencies (pinned versions)
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
rand = "0.9"
nix = { version = "0.29", features = ["ptrace", "signal", "process", "sched"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tonic = "0.12"
tonic-health = "0.12"
kube = { version = "0.98", default-features = false, features = ["runtime", "derive", "client", "rustls-tls"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
proptest = "1"

# OpenTelemetry (HTTP transport via reqwest, per E9 review — avoids protoc requirement)
opentelemetry = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["reqwest-client", "reqwest-blocking-client", "trace", "metrics", "http-proto"] }
tracing-opentelemetry = "0.33"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
