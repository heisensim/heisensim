[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/heisensim/heisensim"
homepage = "https://heisensim.dev"
authors = ["Heisensim Contributors"]

[workspace.dependencies]
heisensim-core = { path = "crates/core" }
heisensim-intercept = { path = "crates/intercept" }
heisensim-fault = { path = "crates/fault" }
heisensim-props = { path = "crates/props" }

# External dependencies (pinned versions)
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
rand = "0.9"
nix = { version = "0.29", features = ["ptrace", "signal", "process", "sched"] }
uuid = { version = "1", features = ["v4"] }
